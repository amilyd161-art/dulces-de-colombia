<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dulces de Colombia</title>
  <link rel="stylesheet" href="estilo.css?v=2">
</head>
<body>

  <header class="menu">
    <a href="index.html" class="logo">
      <span class="logo-icono">🏺</span>
      <span>Dulces<br><strong>de Colombia</strong></span>
    </a>
    <nav>
      <a href="index.html" class="activo">Inicio</a>
      <a href="regiones.html">Regiones</a>
      <a href="#">Recetas</a>
      <a href="#">Sobre el proyecto</a>
      <span class="buscar">🔍</span>
    </nav>
  </header>

  <main class="hero">
    <section class="texto">
      <h1>Un país,<br>mil sabores</h1>
      <p>Descubre los postres típicos de cada región de Colombia. Haz clic en el mapa y conoce la dulzura de su cultura.</p>
      <a href="#mapa" class="explorar">📍 Explora el mapa</a>
    </section>

    <section class="mapa" id="mapa">
      <span class="etiqueta-region caribe">🌴 Caribe</span>
      <span class="etiqueta-region pacifica">🐋 Pacífica</span>
      <span class="etiqueta-region andina">⛰️ Andina</span>
      <span class="etiqueta-region orinoquia">Orinoquía</span>
      <span class="etiqueta-region amazonia">🌳 Amazonía</span>

      <svg id="mapa-svg" viewBox="240 80 660 900" xmlns="http://www.w3.org/2000/svg"
           role="img" aria-label="Mapa de Colombia por departamentos"></svg>
    </section>
  </main>

  <script src="mapa.js"></script>
  <script>
    // Dibuja cada departamento como un enlace clicable
    const svg = document.getElementById('mapa-svg');
    const NS = 'http://www.w3.org/2000/svg';

    DEPARTAMENTOS.forEach(dep => {
      const enlace = document.createElementNS(NS, 'a');
      enlace.setAttribute('href', 'departamento.html?d=' + dep.id);

      const forma = document.createElementNS(NS, 'path');
      forma.setAttribute('d', dep.d);
      forma.setAttribute('fill', dep.color);
      forma.setAttribute('class', 'dep');

      const titulo = document.createElementNS(NS, 'title');
      titulo.textContent = dep.nombre;

      forma.appendChild(titulo);
      enlace.appendChild(forma);
      svg.appendChild(enlace);
    });
  </script>

</body>
</html>
