<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dulces de Colombia</title>
  <link rel="stylesheet" href="estilo.css?v=2">
  <link rel="stylesheet" href="vista-previa.css?v=2">
  <link rel="stylesheet" href="ventana.css?v=1">
</head>
<body>

  <header class="menu">
    <a href="index.html" class="logo">
      <span class="logo-icono">🏺</span>
      <span>Dulces<br><strong>de Colombia</strong></span>
    </a>
    <nav>
      <a href="index.html" class="activo">Inicio</a>
      <a href="regiones.html">Regiones</a>
      <a href="#">Recetas</a>
      <a href="#">Sobre el proyecto</a>
      <span class="buscar">🔍</span>
    </nav>
  </header>

  <main class="hero">
    <section class="texto">
      <h1>Un país,<br>mil sabores</h1>
      <p>Descubre los postres típicos de cada región de Colombia. Haz clic en el mapa y conoce la dulzura de su cultura.</p>
      <a href="#mapa" class="explorar">📍 Explora el mapa</a>
    </section>

    <section class="mapa" id="mapa">
      <span class="etiqueta-region caribe">🌴 Caribe</span>
      <span class="etiqueta-region pacifica">🐋 Pacífica</span>
      <span class="etiqueta-region andina">⛰️ Andina</span>
      <span class="etiqueta-region orinoquia">Orinoquía</span>
      <span class="etiqueta-region amazonia">🌳 Amazonía</span>

      <svg id="mapa-svg" viewBox="240 80 660 900" xmlns="http://www.w3.org/2000/svg"
           role="img" aria-label="Mapa de Colombia por departamentos"></svg>
    </section>
  </main>

  <!-- Mini recuadro al pasar el cursor -->
  <div id="vista-previa" class="vista-previa"></div>

  <!-- Ventana con fotos y descripción al hacer clic -->
  <div id="ventana" class="ventana" aria-hidden="true">
    <div class="v-marca"></div>
    <article class="v-tarjeta" role="dialog" aria-modal="true" aria-labelledby="v-titulo">
      <button type="button" class="v-cerrar" aria-label="Cerrar">✕</button>
      <header class="v-cabecera">
        <span class="v-region"></span>
        <h2 id="v-titulo"></h2>
      </header>
      <div class="v-cuerpo">
        <figure class="v-polaroid">
          <div class="v-foto">
            <img alt="" hidden>
            <div class="v-sin-foto" hidden></div>
          </div>
        </figure>
        <div class="v-texto">
          <div class="v-nav">
            <button type="button" class="v-ant" aria-label="Postre anterior">←</button>
            <span class="v-numero"></span>
            <button type="button" class="v-sig" aria-label="Postre siguiente">→</button>
          </div>
          <h3 class="v-nombre"></h3>
          <p class="v-descripcion"></p>
        </div>
      </div>
      <div class="v-lista"></div>
    </article>
  </div>

  <script src="mapa.js"></script>
  <script src="postres.js"></script>
  <script src="detalle-postres.js"></script>
  <script src="ventana.js"></script>
  <script>
    const svg = document.getElementById('mapa-svg');
    const vista = document.getElementById('vista-previa');
    const NS = 'http://www.w3.org/2000/svg';

    function mostrarVista(dep, evento) {
      const nombres = itemsDe(dep).map(i => i.nombre);
      vista.style.setProperty('--color', dep.color);
      vista.innerHTML = '<h4>' + dep.nombre + '</h4>' +
        (nombres.length
          ? '<ol>' + nombres.map(p => '<li>' + p + '</li>').join('') + '</ol>'
          : '<p>Próximamente</p>');
      vista.classList.add('visible');
      moverVista(evento);
    }

    function moverVista(e) {
      const margen = 18;
      let x = e.clientX + margen;
      let y = e.clientY + margen;
      if (x + vista.offsetWidth > window.innerWidth - 10) x = e.clientX - vista.offsetWidth - margen;
      if (y + vista.offsetHeight > window.innerHeight - 10) y = e.clientY - vista.offsetHeight - margen;
      vista.style.left = x + 'px';
      vista.style.top = y + 'px';
    }

    function ocultarVista() {
      vista.classList.remove('visible');
    }

    DEPARTAMENTOS.forEach(dep => {
      const forma = document.createElementNS(NS, 'path');
      forma.setAttribute('d', dep.d);
      forma.setAttribute('fill', dep.color);
      forma.setAttribute('class', 'dep');
      forma.setAttribute('tabindex', '0');
      forma.setAttribute('role', 'button');
      forma.setAttribute('aria-label', dep.nombre);

      forma.addEventListener('mouseenter', e => mostrarVista(dep, e));
      forma.addEventListener('mousemove', moverVista);
      forma.addEventListener('mouseleave', ocultarVista);
      forma.addEventListener('click', () => { ocultarVista(); abrirVentana(dep); });
      forma.addEventListener('keydown', e => { if (e.key === 'Enter') abrirVentana(dep); });

      svg.appendChild(forma);
    });
  </script>

</body>
</html>
