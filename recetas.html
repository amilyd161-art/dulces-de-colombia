<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recetas - Dulces de Colombia</title>
  <link rel="stylesheet" href="estilo.css?v=2">
  <link rel="stylesheet" href="recetas.css?v=1">
</head>
<body>

  <!-- Dibujos reutilizables (hojas y flor) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="hoja" viewBox="0 0 80 50">
      <path d="M2 42 C 8 10, 42 -2, 78 4 C 74 34, 42 52, 2 42 Z" fill="currentColor"/>
      <path d="M2 42 C 25 30, 50 18, 74 7" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="1.6" stroke-linecap="round"/>
    </symbol>
    <symbol id="flor" viewBox="-50 -50 100 100">
      <g fill="currentColor" stroke="rgba(120,30,50,.3)" stroke-width="1.2">
        <ellipse cx="0" cy="-24" rx="15" ry="25"/>
        <ellipse cx="0" cy="-24" rx="15" ry="25" transform="rotate(72)"/>
        <ellipse cx="0" cy="-24" rx="15" ry="25" transform="rotate(144)"/>
        <ellipse cx="0" cy="-24" rx="15" ry="25" transform="rotate(216)"/>
        <ellipse cx="0" cy="-24" rx="15" ry="25" transform="rotate(288)"/>
      </g>
      <circle r="9" fill="#f6c24a"/>
      <path d="M0 0 L16 -26" stroke="#c4506b" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="16" cy="-26" r="3.2" fill="#f6c24a"/>
    </symbol>
  </svg>

  <header class="menu">
    <a href="index.html" class="logo">
      <span class="logo-icono">🏺</span>
      <span>Dulces<br><strong>de Colombia</strong></span>
    </a>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="regiones.html">Regiones</a>
      <a href="recetas.html" class="activo">Recetas</a>
      <a href="sobre-proyecto.html">Sobre el proyecto</a>
    </nav>
  </header>

  <main class="pagina-recetas">

    <!-- Flores alrededor (solo decoración) -->
    <svg class="flores flores-arriba-izq" viewBox="0 0 260 220" aria-hidden="true">
      <use href="#hoja" x="0" y="20" width="130" height="80" transform="rotate(25 65 60)" style="color:#4f7a3a"/>
      <use href="#hoja" x="20" y="110" width="120" height="74" transform="rotate(-15 80 147)" style="color:#6a9448"/>
      <use href="#hoja" x="110" y="0" width="110" height="68" transform="rotate(55 165 34)" style="color:#3f6a35"/>
      <use href="#flor" x="60" y="40" width="120" height="120" style="color:#e8718c"/>
      <use href="#flor" x="170" y="110" width="60" height="60" style="color:#f2c230"/>
    </svg>
    <svg class="flores flores-arriba-der" viewBox="0 0 260 220" aria-hidden="true">
      <use href="#hoja" x="120" y="20" width="130" height="80" transform="rotate(-30 185 60)" style="color:#4f7a3a"/>
      <use href="#hoja" x="100" y="110" width="130" height="80" transform="rotate(15 165 150)" style="color:#6a9448"/>
      <use href="#flor" x="110" y="50" width="110" height="110" style="color:#d9a8d6"/>
      <use href="#flor" x="40" y="20" width="56" height="56" style="color:#e8718c"/>
    </svg>
    <svg class="flores flores-abajo-izq" viewBox="0 0 240 200" aria-hidden="true">
      <use href="#hoja" x="0" y="100" width="130" height="80" transform="rotate(-25 65 140)" style="color:#3f6a35"/>
      <use href="#hoja" x="70" y="110" width="120" height="74" transform="rotate(10 130 147)" style="color:#6a9448"/>
      <use href="#flor" x="30" y="40" width="100" height="100" style="color:#f2c230"/>
      <use href="#flor" x="120" y="70" width="60" height="60" style="color:#e8718c"/>
    </svg>
    <svg class="flores flores-abajo-der" viewBox="0 0 260 220" aria-hidden="true">
      <use href="#hoja" x="110" y="90" width="140" height="86" transform="rotate(-40 180 133)" style="color:#4f7a3a"/>
      <use href="#hoja" x="40" y="130" width="130" height="80" transform="rotate(5 105 170)" style="color:#6a9448"/>
      <use href="#flor" x="100" y="60" width="120" height="120" style="color:#e8718c"/>
      <use href="#flor" x="60" y="40" width="50" height="50" style="color:#d9a8d6"/>
    </svg>

    <section class="r-encabezado">
      <h1>Las recetas<br>más famosas</h1>
      <p>Ocho dulces por región para preparar en casa, paso a paso.</p>
      <svg class="r-subrayado" viewBox="0 0 300 16" preserveAspectRatio="none" aria-hidden="true">
        <path d="M4 10 C 50 2, 100 14, 150 8 S 250 4, 296 9" fill="none" stroke="#e0a526" stroke-width="5" stroke-linecap="round"/>
      </svg>
    </section>

    <div class="r-cuerpo">

      <aside class="r-lateral">
        <h2>Explora por región</h2>
        <div class="r-regiones" role="tablist" aria-label="Regiones">
          <button type="button" class="r-region" data-region="caribe" role="tab"><span>🌴</span>Caribe</button>
          <button type="button" class="r-region" data-region="andina" role="tab"><span>⛰️</span>Andina</button>
          <button type="button" class="r-region" data-region="pacifica" role="tab"><span>🐋</span>Pacífica</button>
          <button type="button" class="r-region" data-region="amazonia" role="tab"><span>🌳</span>Amazonía</button>
          <button type="button" class="r-region" data-region="orinoquia" role="tab"><span>🌾</span>Orinoquía</button>
          <button type="button" class="r-region" data-region="insular" role="tab"><span>🏝️</span>Insular</button>
        </div>
        <p class="r-notita">6 regiones,<br>48 recetas para endulzar a Colombia ♡</p>
      </aside>

      <section class="r-contenido">
        <h3 class="r-titulo-region"></h3>
        <ul class="r-grilla"></ul>
      </section>

    </div>
  </main>

  <!-- Ventana con la receta -->
  <div id="receta" class="receta" aria-hidden="true">
    <article class="rc-tarjeta" role="dialog" aria-modal="true" aria-labelledby="rc-nombre">
      <button type="button" class="rc-cerrar" aria-label="Cerrar">✕</button>

      <div class="rc-cabeza">
        <figure class="rc-foto">
          <img alt="" hidden>
          <div class="rc-sin-foto" hidden></div>
        </figure>
        <div class="rc-datos">
          <span class="rc-region"></span>
          <h2 id="rc-nombre"></h2>
          <p class="rc-lugar"></p>
          <ul class="rc-chips">
            <li class="rc-tiempo"></li>
            <li class="rc-porciones"></li>
          </ul>
        </div>
      </div>

      <div class="rc-cuerpo">
        <section class="rc-ingredientes">
          <h3>Ingredientes</h3>
          <ul></ul>
        </section>
        <section class="rc-pasos">
          <h3>Preparación</h3>
          <ol></ol>
        </section>
      </div>
    </article>
  </div>

  <script src="recetas-datos.js"></script>
  <script src="recetas.js?v=1"></script>

</body>
</html>
