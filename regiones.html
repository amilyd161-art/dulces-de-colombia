<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Regiones - Dulces de Colombia</title>
  <link rel="stylesheet" href="estilo.css?v=2">
  <link rel="stylesheet" href="regiones.css?v=2">
</head>
<body>

  <header class="menu">
    <a href="index.html" class="logo">
      <span class="logo-icono">🏺</span>
      <span>Dulces<br><strong>de Colombia</strong></span>
    </a>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="regiones.html" class="activo">Regiones</a>
      <a href="#">Recetas</a>
      <a href="#">Sobre el proyecto</a>
    </nav>
  </header>

  <main class="pagina-regiones">

    <section class="encabezado">
      <h1>Un recorrido<br>por la dulzura</h1>
      <p>Seis regiones, seis maneras de contar Colombia a través de sus postres.</p>
      <div class="raya"></div>
    </section>

    <div class="nota">Elige una región y empieza el viaje →</div>

    <section class="tarjetas">

      <button type="button" class="tarjeta caribe" data-region="caribe">
        <div class="foto"><img src="imagenes/caribe.jpg" alt="Región Caribe"></div>
        <div class="info">
          <span class="numero">01</span>
          <h2>Caribe</h2>
          <p>Siete departamentos bañados por el mar Caribe, entre playas, ciénagas y sabanas. Aquí el coco, el ñame, el tamarindo y la panela se convierten en dulces de calle y de plaza.</p>
          <span class="flecha">Ver sus dulces →</span>
        </div>
      </button>

      <button type="button" class="tarjeta andina" data-region="andina">
        <div class="foto"><img src="imagenes/andina.jpg" alt="Región Andina"></div>
        <div class="info">
          <span class="numero">02</span>
          <h2>Andina</h2>
          <p>El corazón montañoso del país, atravesado por las tres cordilleras. Tierra de café, caña panelera y tradición lechera: de aquí salen arequipes, brevas, bocadillos y cuajadas.</p>
          <span class="flecha">Ver sus dulces →</span>
        </div>
      </button>

      <button type="button" class="tarjeta pacifica" data-region="pacifica">
        <div class="foto"><img src="imagenes/pacifica.jpg" alt="Región Pacífica"></div>
        <div class="info">
          <span class="numero">03</span>
          <h2>Pacífica</h2>
          <p>Selva húmeda, ríos y costa sobre el océano Pacífico. Su dulcería mezcla herencia afro e indígena con frutas como el borojó, el chontaduro y el coco.</p>
          <span class="flecha">Ver sus dulces →</span>
        </div>
      </button>

      <button type="button" class="tarjeta amazonia" data-region="amazonia">
        <div class="foto"><img src="imagenes/amazonia.jpg" alt="Región Amazónica"></div>
        <div class="info">
          <span class="numero">04</span>
          <h2>Amazonía</h2>
          <p>La gran selva del sur del país. Sus frutos, como el copoazú, el arazá, el camu camu y la cocona, dan dulces ácidos, aromáticos y llenos de identidad indígena.</p>
          <span class="flecha">Ver sus dulces →</span>
        </div>
      </button>

      <button type="button" class="tarjeta orinoquia" data-region="orinoquia">
        <div class="foto"><img src="imagenes/orinoquia.jpg" alt="Región Orinoquía"></div>
        <div class="info">
          <span class="numero">05</span>
          <h2>Orinoquía</h2>
          <p>Los Llanos Orientales: sabanas inmensas, ríos y vida ganadera. La leche, la panela y frutas como el moriche y el merey protagonizan sus dulces de campo.</p>
          <span class="flecha">Ver sus dulces →</span>
        </div>
      </button>

      <button type="button" class="tarjeta insular" data-region="insular">
        <div class="foto"><img src="imagenes/insular.jpg" alt="Región Insular"></div>
        <div class="info">
          <span class="numero">06</span>
          <h2>Insular</h2>
          <p>El archipiélago de San Andrés, Providencia y Santa Catalina, en pleno mar Caribe. La cultura raizal se siente en sus dulces de coco y en recetas con nombre en inglés criollo.</p>
          <span class="flecha">Ver sus dulces →</span>
        </div>
      </button>

    </section>
  </main>

  <!-- Lluvia de dulces: se abre al hacer clic en una región -->
  <div id="lluvia" class="lluvia" aria-hidden="true">
    <div class="ll-cabecera">
      <p class="ll-antetitulo">Lluvia de dulces</p>
      <button type="button" class="ll-cerrar" aria-label="Cerrar">✕</button>
    </div>
    <div class="ll-tablero">
      <svg class="ll-hilos" aria-hidden="true"></svg>
    </div>
  </div>

  <script src="mapa.js"></script>
  <script src="postres.js"></script>
  <script src="detalle-postres.js"></script>
  <script src="lluvia.js?v=1"></script>

</body>
</html>
